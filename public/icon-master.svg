<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c93ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#03202b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Square background (iOS applies its own corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- Radio signal arcs, top-right, echoing the in-app header mark -->
  <g opacity="0.85" filter="url(#soft)">
    <path d="M 700 300 Q 700 140 860 140" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 748 300 Q 748 200 848 200" stroke="#eafcff" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="860" cy="140" r="20" fill="#ffffff"/>
  </g>

  <!-- Music note glyph, centered, filled white -->
  <g filter="url(#soft)">
    <path d="M 398 706 V 300 L 706 234 V 592"
      fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="342" cy="706" r="82" fill="#ffffff"/>
    <circle cx="650" cy="650" r="82" fill="#ffffff"/>
  </g>
</svg>
