<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond squircle monochrome orange carotte fonce -->
  <rect width="512" height="512" rx="115" fill="#C84B08"/>

  <!-- Cadran / Enceinte radio centrale (inspiration cercle assiette) -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <!-- Bouton rotatif analogique / Coeur du tuner -->
  <circle cx="256" cy="256" r="52" fill="#FFFFFF"/>

  <!-- Ondes hertziennes gauche (remplace la fourchette avec la meme harmonie de colonnes) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 118 190 A 185 185 0 0 0 118 322" stroke-width="16"/>
    <path d="M 88 165 A 215 215 0 0 0 88 347" stroke-width="14"/>
    <path d="M 58 140 A 245 245 0 0 0 58 372" stroke-width="12"/>
  </g>

  <!-- Antenne droite (remplace le couteau avec la meme silhouette elancee) -->
  <g fill="#FFFFFF">
    <!-- Bille de reception -->
    <circle cx="446" cy="110" r="17"/>
    <!-- Brin metallique avec bout arrondi -->
    <rect x="438" y="110" width="16" height="290" rx="8"/>
  </g>
</svg>
